# Pin Node major 22 for Coolify/Nixpacks builds.
# Nixpacks only selects a major version; the nixpkgs archive supplies the
# latest 22.x patch (must be >= 22.23.4 for CVE-2026-111497 and related fixes).
# See: https://nixpacks.com/docs/providers/node
#      https://coolify.io/docs/applications/builds/nixpacks/node-versioning

providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
